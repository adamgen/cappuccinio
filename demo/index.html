<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדגמת Cappuccin.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/video.js@8.20.0/dist/video-js.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@videojs/themes@1/dist/city/index.css" rel="stylesheet"/>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --radius: 0.75rem;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Heebo', sans-serif;
        }

        .header p {
            font-size: 1.125rem;
            color: #6b7280;
            font-family: 'Heebo', sans-serif;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .video-container {
            background: white;
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .controls {
            background: white;
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .control-group {
            margin-bottom: 2rem;
        }

        .control-group h3 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        .options-grid {
            display: grid;
            gap: 1rem;
        }

        .option-button {
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            font-weight: 500;
            width: 100%;
            text-align: left;
        }

        .option-button:hover {
            border-color: var(--primary-color);
            background: #f8fafc;
        }

        .option-button.selected {
            border-color: var(--primary-color);
            background: #f0f7ff;
        }

        .image-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .image-option {
            aspect-ratio: 16/9;
            border-radius: calc(var(--radius) - 0.25rem);
            overflow: hidden;
            cursor: pointer;
            border: 2px solid var(--border-color);
            transition: all 0.2s;
        }

        .image-option:hover {
            border-color: var(--primary-color);
        }

        .image-option.selected {
            border-color: var(--primary-color);
            box-shadow: var(--shadow);
        }

        .image-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 768px) {
            .demo-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>הדגמת וידאו מותאם אישית</h1>
            <p>התאם את הוידאו על ידי בחירת חברה ותמונה מלמטה</p>
        </header>

        <demo-wrapper></demo-wrapper>
    </div>

    <script type="module" src="demo-wrapper.js"></script>
</body>
</html>
